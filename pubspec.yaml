name: attendx
description: Attendance for Android with optional Google Drive backup.
publish_to: "none"
version: 1.2.2+5
homepage: https://github.com/dd-joshi/AttendX
repository: https://github.com/dd-joshi/AttendX
issue_tracker: https://github.com/dd-joshi/AttendX/issues

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.5"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  share_plus: ^13.0.0
  uuid: ^4.4.0
  intl: ^0.19.0
  path_provider: ^2.1.3
  file_picker: ^13.0.0
  http: ^1.6.0
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - PRIVACY.md

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/attendx_icon.png"
  min_sdk_android: 24
